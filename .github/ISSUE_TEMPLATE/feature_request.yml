name: Feature Request
description: Propose product, platform, reliability, or DX improvements.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - pipeline/runtime
        - data quality/contracts
        - warehouse/serving
        - api
        - dashboard
        - observability
        - ci/cd
        - documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What gap or risk are we addressing?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Expected behavior, constraints, and design boundaries.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Objective completion conditions.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Rejected options and why.

  - type: textarea
    id: risks
    attributes:
      label: Risks and trade-offs
      description: Complexity, migration, cost, operational implications.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Which tests, checks, and observability signals will confirm success?
    validations:
      required: true

