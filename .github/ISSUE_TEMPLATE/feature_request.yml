name: Feature Request
description: Propose a new capability, workflow, or engineering improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - data pipeline
        - data quality
        - warehouse
        - api
        - streamlit
        - developer experience
        - documentation
        - repository governance
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What gap, inefficiency, or operational risk are we solving?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe expected behavior, boundaries, and key constraints.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define how the change will be considered complete.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and trade-offs
      description: Note complexity, migration impact, operational cost, or maintenance burden.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List rejected or possible alternative approaches.
  - type: markdown
    attributes:
      value: |
        If this proposal changes behavior, workflow, or package layout, review:
        - `README.md`
        - `docs/REPOSITORY_STRUCTURE.md`
        - `CONTRIBUTING.md`
