name: Bug Report
description: Report a defect, regression, data quality issue, or operational failure.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - pipeline
        - api
        - warehouse
        - streamlit
        - tests
        - docs
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide deterministic steps, inputs, and commands.
      placeholder: |
        1. Run ...
        2. Use dataset/config ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain business, operational, or engineering impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Paste logs, tracebacks, screenshots, or manifest excerpts.
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include branch, OS, Python version, and relevant config overrides.
  - type: markdown
    attributes:
      value: |
        Documentation references:
        - International: `README.md`
        - PT-BR: `docs/README.pt-BR.md`
        - PT-PT: `docs/README.pt-PT.md`
