name: Bug Report
description: Report defects, regressions, data quality failures, or operational incidents.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Business and operational impact.
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: dropdown
    id: affected_surface
    attributes:
      label: Affected surface
      options:
        - pipeline
        - data quality
        - contracts/schema
        - warehouse
        - api
        - dashboard
        - ci/cd
        - documentation
    validations:
      required: true

  - type: textarea
    id: observed_behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: reproducibility
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Command/config used
        2. Input dataset or environment
        3. Result / error
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, traceback, screenshots, run manifest/status excerpts.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Branch, OS, Python version, and relevant env overrides.
    validations:
      required: true

  - type: textarea
    id: business_impact
    attributes:
      label: Business/operational impact
      description: What is blocked or at risk?
    validations:
      required: true

