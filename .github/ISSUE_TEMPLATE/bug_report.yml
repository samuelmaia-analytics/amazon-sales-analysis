name: Bug Report
description: Report a defect, regression, data quality issue, or operational failure.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Classify the production and maintenance impact.
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - pipeline
        - validation
        - warehouse
        - api
        - streamlit
        - automation
        - documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide deterministic steps, inputs, and commands.
      placeholder: |
        1. Run ...
        2. Use dataset/config ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain business, operational, or engineering impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Paste logs, tracebacks, screenshots, or manifest excerpts.
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include branch, OS, Python version, and relevant config overrides.
  - type: markdown
    attributes:
      value: |
        Review the main docs before opening larger defects tied to workflow or architecture:
        - `README.md`
        - `docs/REPOSITORY_STRUCTURE.md`
        - `CONTRIBUTING.md`
